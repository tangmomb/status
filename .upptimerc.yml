# Surveillance externe du RAG IONIS (VPS Contabo) : GitHub Actions teste les URL toutes les
# 5 minutes depuis l'extérieur du VPS, ouvre une issue par incident et publie la page de statut.
# Alertes Telegram : secrets NOTIFICATION_TELEGRAM, NOTIFICATION_TELEGRAM_BOT_KEY,
# NOTIFICATION_TELEGRAM_CHAT_ID. Docs : https://upptime.js.org/docs/configuration
owner: tangmomb
repo: status

sites:
  - name: RAG IONIS · interface
    url: https://ionis.tanguym.fr
    maxResponseTime: 5000
  - name: RAG IONIS · API
    url: https://ionis.tanguym.fr/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 3000
  - name: Monitoring Beszel
    url: https://monitor.tanguym.fr
    maxResponseTime: 5000

status-website:
  baseUrl: /status
  name: Statut · RAG IONIS
  introTitle: "Statut du **RAG IONIS**"
  introMessage: >-
    Disponibilité et temps de réponse mesurés toutes les 5 minutes depuis GitHub Actions,
    hors du serveur surveillé. Chaque panne ouvre une issue publique dans
    [ce dépôt](https://github.com/tangmomb/status/issues).
  navbar:
    - title: Statut
      href: /
    - title: RAG IONIS
      href: https://ionis.tanguym.fr
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

i18n:
  activeIncidents: Incidents en cours
  allSystemsOperational: Tous les systèmes fonctionnent
  incidentReport: "Incident n°$NUMBER →"
  activeIncidentSummary: Ouvert le $DATE, $POSTS messages
  incidentTitle: Incident $NUMBER
  incidentDetails: Détails de l'incident
  incidentFixed: Résolu
  incidentOngoing: En cours
  incidentOpenedAt: Ouvert le
  incidentClosedAt: Fermé le
  incidentBack: ← Tous les incidents
  pastIncidents: Incidents passés
  pastIncidentsResolved: Résolu en $MINUTES minutes, $POSTS messages
  liveStatus: En direct
  overallUptime: "Disponibilité : $UPTIME"
  averageResponseTime: "Temps de réponse moyen : $TIMEms"
  sevenDays: 7 jours
  thirtyDays: 30 jours
  oneYear: 1 an
  allTime: Depuis le début
  duration: Durée
  degraded: Dégradé
  down: En panne
  up: Opérationnel
  url: URL
